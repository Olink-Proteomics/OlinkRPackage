name: affinity-proteomics
description: SDRF template for affinity-based proteomics experiments (Olink, SomaScan, NULISA). This is the base template for all affinity proteomics experiments.
documentation: |
  The affinity-proteomics template is one of three usable-alone technology templates. It
  covers antibody-based (Olink PEA, NULISA) and aptamer-based (SomaScan) proteomics platforms.

  Use this template directly for affinity experiments and combine with an organism template.

  Key differences from ms-proteomics:
  - No sample preparation chemistry columns (no digestion, reduction, alkylation).
  - `characteristics[sample type]` is required to distinguish study samples from controls and
    reference materials used for assay calibration/quality control (e.g. study sample,
    negative control, positive control, calibrator, plate control, quality control sample).
  - `comment[platform]` identifies the specific instrument/platform.
  - `comment[panel name]` is RECOMMENDED, but it MUST be provided when `comment[platform]`
    refers to a platform family with multiple panels/menus and the panel/menu cannot be
    uniquely inferred (e.g., `Olink Target 96`, `SomaScan Assay v5.0`).
  - `comment[quantification unit]`: NPX for Olink, RFU for SomaScan, NPQ for NULISA.
  - `characteristics[sample matrix]`: The biological fluid analyzed (serum, plasma, CSF, etc.).
  - `comment[dilution]`: Recommended; record the sample dilution (bin) each measurement comes from, especially for SomaScan.
  - `comment[lot number]`: Optional reagent lot for traceability.
  - `comment[normalization method]`: Recommended; how data was normalized (plate control, bridge, ANML, etc.), with the version where applicable.

  Mutually exclusive with ms-proteomics and ms-metabolomics.
